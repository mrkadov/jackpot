<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slotopol Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="machine">
    <div class="top">
      <h1 id="title">SLOT</h1>
      <p class="sub" id="subtitle">Slotopol motor</p>
    </div>

    <div class="stage">
      <div class="reels" id="reels"></div>
      <div class="win-flash" id="winFlash"></div>
    </div>

    <div class="hud">
      <div class="stat"><span>Bakiye</span><strong id="balance">—</strong></div>
      <div class="stat"><span>Bahis</span><strong id="betLabel">1</strong></div>
      <div class="stat"><span>Hat</span><strong id="selLabel">9</strong></div>
      <div class="stat"><span>Maliyet</span><strong id="costLabel">9</strong></div>
      <div class="stat"><span>Son Kazanç</span><strong id="lastWin">0</strong></div>
      <div class="stat"><span>FS</span><strong id="freeSpins">0</strong></div>
    </div>

    <div class="controls">
      <button id="betDown" type="button">−</button>
      <button id="spin" type="button" class="spin" disabled>ÇEVİR</button>
      <button id="betUp" type="button">+</button>
    </div>

    <div class="msg" id="msg">Bağlanıyor...</div>
  </div>
  <script src="game.js?v=1"></script>
</body>
</html>
