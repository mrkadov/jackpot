<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş | Jackpot</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="particles-js"></div>
  <div class="page-wrap">
    <nav class="menu_head">
      <div class="container nav-inner">
        <a class="brand" href="index.html">
          <span class="brand-cards" aria-hidden="true">🂡🂱🃁🃑</span>
          <span class="brand-name">Jackpot</span>
        </a>
        <button class="nav-toggle" aria-label="Menü">☰</button>
        <div class="nav-links">
          <a href="index.html">Ana Sayfa</a>
          <a href="games.html">Oyunlar</a>
          <a href="contact.html">İletişim</a>
        </div>
        <div class="nav-actions"></div>
      </div>
    </nav>

    <header class="page-hero">
      <div class="container">
        <h1>Giriş Yap</h1>
        <p>Hesabına giriş yap, bakiyeni yönet ve oynamaya devam et.</p>
      </div>
    </header>

    <section class="content-section">
      <div class="container">
        <form id="loginForm" class="card-panel auth-box">
          <label for="email">E-posta</label>
          <input id="email" type="email" required placeholder="ornek@mail.com" />
          <label for="password">Şifre</label>
          <input id="password" type="password" required placeholder="••••••••" />
          <button class="btn btn-lg" type="submit" style="width:100%">Giriş</button>
          <p id="formError"></p>
          <p style="margin-top:1rem;text-align:center;color:var(--text-muted)">
            Hesabın yok mu? <a href="signup.html" style="color:var(--gold)">Kayıt Ol</a>
          </p>
        </form>
      </div>
    </section>
  </div>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-pages.js"></script>
</body>
</html>
